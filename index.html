/* LOGO BACKGROUND */
body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    width: 650px;
    height: 650px;
    background: url("logo.png") no-repeat center;
    background-size: contain;

}

.container {
    position: relative;
    z-index: 2;

    margin: auto;
    background: rgba(30, 41, 59, 0.88);
    padding: 20px;
    border-radius: 16px;

    box-shadow: 0 0 40px rgba(0,0,0,0.6);

h1 { color:#38bdf8; margin:0; }

input {
    padding: 8px;
    width: 130px;
    margin: 6px;
    border-radius: 6px;
    border: none;
}

button {
    padding: 10px 16px;
    margin: 6px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: 0.2s;
}

button:hover { transform: scale(1.05); }

.true { background:#22c55e; color:white; }
.false { background:#ef4444; color:white; }
.start { background:#3b82f6; color:white; }

.quit { background:#f97316; color:white; }
.restart { background:#22c55e; color:white; }
.menu { background:#0ea5e9; color:white; }

.question { font-size:22px; margin:15px; }
.timer, .round { color:#fbbf24; }
.score { margin-top:10px; }

/* POPUP */
.popup {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 90px;
    opacity: 0;
    transition: 0.3s;
    z-index: 999;
}

.popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.3);
}

/* CONFETTI */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<!-- GAME -->
<div id="game" style="display:none;">

    <div class="round" id="roundTimer"></div>
    <div class="timer" id="timer"></div>

    <div class="question" id="question"></div>
    <div id="qIndex"></div>

    <button class="true" onclick="answer(true)">True</button>

    <br>

<!-- END -->
<div id="end" style="display:none;">

<div id="popup" class="popup"></div>

let bank=[];
while(bank.length<150){
    bank.push(...baseBank);
}
bank=bank.slice(0,150);

/* =========================
   STATE
========================= */

let questions=[];
let index=0;
let score=0;

let qTimer;
let roundTimer;

let qTimeLeft;
let roundTimeLeft;

let timeLimit;
let gameActive=true;

/* =========================
   SHUFFLE
========================= */

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
}

/* =========================
   START
========================= */

function startGame(){

    let count=parseInt(document.getElementById("qCount").value);
    timeLimit=parseInt(document.getElementById("tLimit").value);
    let roundMin=parseInt(document.getElementById("roundTime").value);

    questions=[...bank];
    shuffle(questions);
    questions=questions.slice(0,count);

    index=0;
    score=0;
    gameActive=true;

    roundTimeLeft=roundMin*60;

    clearInterval(roundTimer);

    roundTimer=setInterval(()=>{
        if(!gameActive) return;
        roundTimeLeft--;
        document.getElementById("roundTimer").innerText =
            "Round Time Left: " + roundTimeLeft + "s";
        if(roundTimeLeft<=0) endGame();
    },1000);

    document.getElementById("setup").style.display="none";
    document.getElementById("game").style.display="block";
    document.getElementById("end").style.display="none";

    loadQ();
}

/* =========================
   LOAD QUESTION
========================= */

function loadQ(){

    if(!gameActive) return;

    if(index>=questions.length){
        endGame();
        return;
    }

    document.getElementById("question").innerText = questions[index].q;
    document.getElementById("qIndex").innerText =
        `Question ${index+1} / ${questions.length}`;

    qTimeLeft=timeLimit;

    clearInterval(qTimer);

    qTimer=setInterval(()=>{
        if(!gameActive) return;

        qTimeLeft--;
        document.getElementById("timer").innerText="Time: "+qTimeLeft+"s";

        if(qTimeLeft<=0){
            clearInterval(qTimer);
            nextQuestion();
        }
    },1000);
}

/* =========================
   ANSWER (FIXED AUTO-NEXT)
========================= */

function answer(val){

    if(!gameActive) return;

    clearInterval(qTimer);

    let correct = questions[index].a === val;

    if(correct){
        score += 5;
        document.getElementById("score").innerText="Score: "+score;
        popup("😄",true);
        confetti();
    } else {
        popup("😢",false);
    }

    // ALWAYS MOVE NEXT (TRUE OR FALSE)
    setTimeout(()=>{
        nextQuestion();
    },350);
}

/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){
    index++;
    loadQ();
}

/* =========================
   QUIT
========================= */

function quitGame(){
    gameActive=false;
    clearInterval(qTimer);
    clearInterval(roundTimer);
    showEnd("Game Quit");
}

/* =========================
   END
========================= */

function endGame(){
    gameActive=false;
    clearInterval(qTimer);
    clearInterval(roundTimer);
    showEnd("Round Complete");
}

function showEnd(title){

    document.getElementById("game").style.display="none";
    document.getElementById("end").style.display="block";

    document.getElementById("finalScore").innerHTML =
        `<h2>${title}</h2>
         Final Score: <b>${score}</b> / ${questions.length*5}`;
}

/* =========================
   MENU CONTROLS
========================= */

function restartRound(){
    startGame();
}

function mainMenu(){
    document.getElementById("setup").style.display="block";
    document.getElementById("game").style.display="none";
    document.getElementById("end").style.display="none";
}

/* =========================
   POPUP
========================= */

function popup(icon,good){
    let p=document.getElementById("popup");
    p.innerText=icon;
    p.style.color=good?"#22c55e":"#ef4444";
    p.classList.add("show");
    setTimeout(()=>p.classList.remove("show"),600);
}

/* =========================
   CONFETTI
========================= */

function confetti(){
    for(let i=0;i<20;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=["#22c55e","#3b82f6","#fbbf24","#ef4444"][Math.floor(Math.random()*4)];
        c.style.animationDuration=(Math.random()*2+1)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),3000);
    }
}

</script>
